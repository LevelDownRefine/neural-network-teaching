[project]
name = "neural-network-teaching"
version = "0.1.0"
description = "Reproducible neural network teaching experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    "matplotlib>=3.8,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["mnist/tests"]
pythonpath = ["mnist"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["mnist/models/tssl"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"mnist/train_tssl.py" = ["E402", "I001"]
"mnist/utils/evaluate_tssl.py" = ["E402", "I001"]
