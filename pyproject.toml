[project]
name = "neural-network-teaching"
version = "0.1.0"
description = "Reproducible neural network teaching experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
cpu = ["torch==2.15.0", "torchvision==0.29.2", "snntorch==1.0.0"]
cuda = ["torch==2.15.0", "torchvision==0.29.2", "snntorch==1.0.0"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["mnist/tests", "lif/tests"]
pythonpath = ["mnist", "."]

[tool.ruff]
target-version = "py312"
extend-exclude = ["mnist/models/tssl"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"mnist/train_tssl.py" = ["E402", "I001"]
"mnist/utils/evaluate_tssl.py" = ["E402", "I001"]
