name: Checks
on:
  push:
    branches: [main]
    tags: ['lif-v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            rust:
              - 'lif/simulator/**/*.rs'
              - 'lif/simulator/**/Cargo.{toml,lock}'
              - '.github/workflows/ci.yml'
            desktop:
              - 'lif/simulator/release.ps1'
              - 'lif/simulator/core/pyproject.toml'
              - 'lif/model.py'
              - 'lif/tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --dev
      - run: uv run --locked --extra cpu ruff check .
      - run: uv run --locked --extra cpu ruff format --check .
      - run: uv run --locked --extra cpu pytest -q
      - run: uv run --locked --extra cpu python mnist/evaluate.py report

  desktop:
    needs: test
    if: startsWith(github.ref, 'refs/tags/lif-v') || needs.test.outputs.rust == 'true' || needs.test.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked --extra cpu --extra rust --dev
      - run: uv run --locked --extra cpu --extra rust pytest -q lif/tests
      - run: cargo fmt --manifest-path lif/simulator/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path lif/simulator/Cargo.toml --workspace --all-targets -- -D warnings
      - run: ./lif/simulator/release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: lif-windows-x64
          path: lif/simulator/dist/*
          if-no-files-found: error

  rust:
    needs: test
    if: startsWith(github.ref, 'refs/tags/lif-v') || needs.test.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path lif/simulator/core/Cargo.toml --check
      - run: cargo test --release --locked --manifest-path lif/simulator/core/Cargo.toml
      - run: cargo clippy --locked --manifest-path lif/simulator/core/Cargo.toml --all-targets -- -D warnings

  release:
    if: startsWith(github.ref, 'refs/tags/lif-v')
    needs: [test, desktop, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lif-windows-x64
          path: dist
      - name: Publish LIF release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "LIF ${TAG#lif-}" --generate-notes
