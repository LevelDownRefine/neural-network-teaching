name: MNIST checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --group snntorch --dev
      - run: uv run --locked --extra cpu --group snntorch ruff check .
      - run: uv run --locked --extra cpu --group snntorch ruff format --check .
      - run: uv run --locked --extra cpu --group snntorch pytest -q
      - run: uv run --locked --extra cpu --group snntorch python mnist/evaluate.py report
