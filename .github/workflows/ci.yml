name: MNIST checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --dev
      - run: uv run --locked --extra cpu ruff check .
      - run: uv run --locked --extra cpu ruff format --check .
      - run: uv run --locked --extra cpu pytest -q
      - run: uv run --locked --extra cpu python mnist/evaluate.py report

  desktop:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync --locked --extra cpu --extra gui --dev
      - run: uv run --locked --extra cpu --extra gui pytest -q lif/tests
      - run: cargo fmt --manifest-path lif/gui-rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path lif/gui-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path lif/gui-rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path lif/gui-rust/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: lif-windows
          path: lif/gui-rust/target/release/lif.exe

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path lif/native/Cargo.toml --check
      - run: cargo test --release --locked --manifest-path lif/native/Cargo.toml
      - run: cargo clippy --locked --manifest-path lif/native/Cargo.toml --all-targets -- -D warnings
