[package]
name = "lif"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"

[workspace]
members = ["core"]
resolver = "2"

[dependencies]
lif-native = { path = "core", features = ["serialization"] }
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }
# 与 egui 0.33 配套；0.0.3 使用 egui 0.34。
egui_software_backend = "=0.0.2"
egui_plot = "0.34"
serde_json = "1"
